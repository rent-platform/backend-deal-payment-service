spring:
  application:
    name: deal-payment-service

  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5433}/${PG_DATABASE:deal_db}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: filesystem:database/migrations

app:
  catalog-service-url: http://localhost:8082
  swagger:
    gateway-url: http://localhost:8080
    deal-payment-service-url: http://localhost:8083

yookassa:
  shop-id: ${YOOKASSA_SHOP_ID:123456}
  secret-key: ${YOOKASSA_SECRET_KEY:test_abc123}
  return-url: ${YOOKASSA_RETURN_URL:http://localhost:3000/payment/return}
  mock-enabled: true

server:
  port: 8083